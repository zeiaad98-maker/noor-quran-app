name: Build Noor Quran APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Generate Android Platform Files
        run: flutter create --platforms=android --org com.noor.quran --project-name noor_quran .

      - name: Inject Location Permissions
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Patch geocoding compileSdk
        run: |
          sed -i 's/compileSdk 33/compileSdk 34/' ~/.pub-cache/hosted/pub.dev/geocoding_android-*/android/build.gradle
          grep -h "compileSdk" ~/.pub-cache/hosted/pub.dev/geocoding_android-*/android/build.gradle

      - name: Analyze code
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-V1
          path: build/app/outputs/flutter-apk/app-release.apk
