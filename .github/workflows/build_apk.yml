name: Build Noor Quran APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Install Android 36 Platform
        run: |
          SDKMGR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          echo y | "$SDKMGR" "platforms;android-36"

      - name: Generate Android Platform Files
        run: flutter create --platforms=android --org com.noor.quran --project-name noor_quran .

      - name: Inject Android Permissions and Notification Receivers
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n        <intent-filter>\n            <action android:name="android.intent.action.BOOT_COMPLETED" />\n            <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n            <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n            <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />\n        </intent-filter>\n    </receiver>\n  </application>|' android/app/src/main/AndroidManifest.xml
          grep -c 'RECEIVE_BOOT_COMPLETED\|SCHEDULE_EXACT_ALARM\|ScheduledNotificationReceiver' android/app/src/main/AndroidManifest.xml

      - name: Set compileSdk 36 and enable desugaring
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          sed -i '/targetSdk = flutter.targetSdkVersion/a\        multiDexEnabled = true' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          grep -n 'compileSdk\|isCoreLibraryDesugaringEnabled\|multiDexEnabled\|desugar_jdk_libs' android/app/build.gradle.kts

      - name: Configure Permanent Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android/app/release.jks
          ls -l android/app/release.jks
          keytool -list -keystore android/app/release.jks -storepass noor123456 -alias noor_key
          cat << 'EOF' > android/key.properties
          storePassword=noor123456
          keyPassword=noor123456
          keyAlias=noor_key
          storeFile=release.jks
          EOF
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.create("release") {\n            storeFile = file("release.jks")\n            storePassword = "noor123456"\n            keyAlias = "noor_key"\n            keyPassword = "noor123456"\n        }/' android/app/build.gradle.kts || true
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' android/app/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch geocoding compileSdk
        run: |
          sed -i 's/compileSdk 33/compileSdk 34/' ~/.pub-cache/hosted/pub.dev/geocoding_android-*/android/build.gradle
          grep -h "compileSdk" ~/.pub-cache/hosted/pub.dev/geocoding_android-*/android/build.gradle

      - name: Disable release lint checks
        run: |
          for f in ~/.pub-cache/hosted/pub.dev/*/android/build.gradle; do
            [ -f "$f" ] || continue
            if grep -q 'checkReleaseBuilds' "$f"; then continue; fi
            if grep -q 'lintOptions {' "$f"; then
              sed -i '/lintOptions {/a\        checkReleaseBuilds false' "$f"
            elif grep -qE '^[[:space:]]*lint \{' "$f"; then
              sed -i '/^[[:space:]]*lint {/a\        checkReleaseBuilds = false' "$f"
            elif grep -q '^android {' "$f"; then
              sed -i '/^android {/a\    lintOptions {\n        checkReleaseBuilds false\n    }' "$f"
            fi
          done
          for f in ~/.pub-cache/hosted/pub.dev/*/android/build.gradle.kts; do
            [ -f "$f" ] || continue
            if grep -q 'checkReleaseBuilds' "$f"; then continue; fi
            if grep -qE '^[[:space:]]*lint \{' "$f"; then
              sed -i '/^[[:space:]]*lint {/a\        checkReleaseBuilds = false' "$f"
            elif grep -q '^android {' "$f"; then
              sed -i '/^android {/a\    lint {\n        checkReleaseBuilds = false\n    }' "$f"
            fi
          done
          sed -i '/compileSdk = 36/a\    lint {\n        checkReleaseBuilds = false\n    }' android/app/build.gradle.kts
          grep -r 'checkReleaseBuilds' ~/.pub-cache/hosted/pub.dev/*/android/build.gradle* android/app/build.gradle.kts | wc -l

      - name: Analyze code
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-V1
          path: build/app/outputs/flutter-apk/app-release.apk
