name: noor_quran
description: تطبيق القرآن الكريم والخدمات الإسلامية المتكامل
publish_to: 'none'
version: 1.0.10+11

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  quran: ^1.3.3
  shared_preferences: ^2.3.2
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  qcf_quran: ^0.0.5
  flutter_screenutil: ^5.9.3
  just_audio: ^0.9.40
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  http: ^1.2.2
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  vibration: ^3.1.8
  wakelock_plus: ^1.5.2
  fluttertoast: ^10.0.2
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran_data/word_meanings.json
    - assets/quran_data/word_lexicon.json
    - assets/quran_data/tafsir_muyassar.json
    - assets/quran_data/word_morphology.json
    - assets/quran_data/word_segments_husary.json
    - assets/quran_data/hizb_quarters.json
    - assets/quran_data/surah_info.json
    - assets/quran_data/asbab_nuzul.json
    - assets/quran_data/surah_sciences.json
    - assets/quran_data/syria_mosques.json
    - assets/surah_names/

  fonts:
    # Hafs Mushaf font (King Fahd Complex, Madinah) — Uthmani script,
    # used for Quranic ayah text in search results, the ayah sheet
    # and the audio player sheet. The reader itself stays QCF.
    - family: Hafs
      fonts:
        - asset: assets/fonts/Hafs_18.ttf
